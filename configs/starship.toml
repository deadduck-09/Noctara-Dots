palette = "noctalia"
# Don't print a new line at the start of the prompt
add_newline = false

format = """
$cmd_duration $directory $git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:subtext0'

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[ ](bold fg:blue)"
error_symbol = "[ ](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:surface2 fg:text"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "[ $symbol $branch(:$remote_branch) ]($style)[](fg:surface2)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:surface2 bold fg:text)[](fg:surface2)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:surface2 fg:text"
style_root = "red bold"
format = "[$user]($style)[](fg:surface2)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:mauve fg:text"
truncation_length = 2
truncation_symbol = ".../"
format = '[ 󰉋 → $path ]($style)[](fg:mauve)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[ 󰪢 $duration ](bold bg:surface2 fg:text)[](fg:surface2)'

